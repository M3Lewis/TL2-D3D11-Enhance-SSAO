name: CI & Protected Release Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '确认发布 Release 资产（勾选表示同意发布）'
        required: true
        type: boolean
        default: false
      tag_name:
        description: '发布版本号（例如 v1.2.8，留空则自动根据日期生成）'
        required: false
        type: string
        default: ''
      release_title:
        description: '发布标题（留空则自动生成）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build & Verify (Plugin & Standalone Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile D3D11 Enhancement Plugin DLL
        shell: powershell
        run: |
          .\build.ps1

      - name: Validate Shaders & Build Standalone Setup Installer
        shell: powershell
        run: |
          .\build_installer.ps1

      - name: Calculate SHA256 Checksums
        shell: powershell
        run: |
          $hashes = Get-FileHash .\bin\Plugin_TL2_DX11_Enhance_SSAO.dll, .\bin\TL2_DX11_Enhance_SSAO_Setup.exe -Algorithm SHA256
          $hashes | Format-Table -AutoSize | Out-String | Set-Content -Encoding utf8 .\bin\SHA256SUMS.txt
          Get-Content .\bin\SHA256SUMS.txt

      - name: Upload Build Artifacts (Private Run Storage)
        uses: actions/upload-artifact@v4
        with:
          name: tl2-dx11-artifacts
          path: |
            bin/Plugin_TL2_DX11_Enhance_SSAO.dll
            bin/Plugin_TL2_DX11_Enhance_SSAO.pdb
            bin/TL2_DX11_Enhance_SSAO_Setup.exe
            bin/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release (User Approval Gate)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tl2-dx11-artifacts
          path: release-assets

      - name: Determine Tag and Release Notes
        id: meta
        shell: powershell
        run: |
          $tag = "${{ inputs.tag_name }}".Trim()
          if (-not $tag) {
              $tag = "v" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          }
          $title = "${{ inputs.release_title }}".Trim()
          if (-not $title) {
              $title = "Torchlight II D3D11 Enhance & SSAO ($tag)"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "title=$title" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/TL2_DX11_Enhance_SSAO_Setup.exe
            release-assets/Plugin_TL2_DX11_Enhance_SSAO.dll
            release-assets/Plugin_TL2_DX11_Enhance_SSAO.pdb
            release-assets/SHA256SUMS.txt
